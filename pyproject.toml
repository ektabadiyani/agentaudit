[project]
name = "agentaudit"
version = "0.1.0"
description = "Measure how accurate an AI support agent really is, graded against its own help centre."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
]

[project.scripts]
agentaudit = "agentaudit.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
